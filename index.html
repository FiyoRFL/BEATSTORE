<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111014">
  <meta name="description" content="Descubrí beats, escuchá instrumentales y contactá directamente con productores independientes.">
  <title>BEATSTORE — Find your sound</title>
  <style>
    :root{color-scheme:dark;--bg:#111014;--panel:#19171f;--panel2:#211e29;--line:#302b39;--text:#f5f2fa;--muted:#aaa3b6;--accent:#b99aff;--accent2:#8e69d5;--green:#b5f2cf}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -15%,#342344 0,transparent 42%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.wrap{max-width:1120px;margin:auto;padding:0 24px}
    header{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff12}
    .brand{display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:.13em;font-size:18px}.logo{width:35px;height:35px;border:1px solid #9d7bd8;border-radius:11px;display:grid;place-items:center;color:var(--accent);font-size:19px}
    .nav{display:flex;align-items:center;gap:24px;color:var(--muted);font-size:13px}.nav a:hover{color:var(--text)}.pill{border:1px solid var(--line);border-radius:999px;padding:9px 14px}
    .hero{padding:76px 0 44px;display:grid;grid-template-columns:1.2fr .8fr;gap:42px;align-items:center}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.19em;text-transform:uppercase}
    h1{font-size:clamp(42px,6vw,72px);line-height:.99;letter-spacing:-.06em;margin:18px 0}.hero p{max-width:500px;color:var(--muted);font-size:16px}
    .hero-art{min-height:245px;border:1px solid #b99aff30;border-radius:24px;background:linear-gradient(145deg,#292032,#17151d 65%);padding:25px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
    .hero-art:after{content:"";position:absolute;width:210px;height:210px;border:1px solid #b99aff44;border-radius:50%;right:-35px;top:-42px;box-shadow:0 0 0 22px #b99aff09,0 0 0 45px #b99aff06}
    .wave{display:flex;align-items:center;justify-content:center;gap:4px;height:92px;z-index:1}.wave i{width:4px;border-radius:5px;background:linear-gradient(var(--accent),#6f52a5);height:var(--h);opacity:.9}
    .art-foot{z-index:1;display:flex;justify-content:space-between;align-items:end}.art-foot strong{font-size:22px;letter-spacing:-.03em}.art-foot span{color:var(--muted);font-size:12px}
    .catalog{padding:32px 0 150px}.section-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:20px}.section-head h2{font-size:25px;letter-spacing:-.04em;margin:5px 0}.section-head p{margin:0;color:var(--muted);font-size:13px}
    .search{width:min(280px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--text);outline:none}.search:focus{border-color:var(--accent2)}
    .filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 22px}.filter{background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--muted);font-size:12px}.filter.active,.filter:hover{background:#b99aff18;border-color:#9d7bd8;color:var(--text)}
    .track-list{border-top:1px solid var(--line)}.track{display:grid;grid-template-columns:42px minmax(0,1fr) 75px 115px;align-items:center;gap:16px;padding:15px 12px;border-bottom:1px solid var(--line);transition:background .15s}.track:hover{background:#ffffff06}.play{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--accent);font-size:15px}.play:disabled{opacity:.35;cursor:not-allowed}.track-name{font-weight:700}.track-meta{color:var(--muted);font-size:12px;margin-top:2px}.bpm{color:var(--muted);font-size:12px;text-align:center}.contact{border:1px solid #9271c7;border-radius:10px;background:#a17ad41a;padding:9px 12px;text-align:center;font-size:12px;font-weight:700}.contact:hover{background:#a17ad433}
    .empty{padding:40px 10px;text-align:center;color:var(--muted)}footer{border-top:1px solid var(--line);padding:24px 0 100px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:20px}
    .player{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#17151df2;backdrop-filter:blur(18px);border-top:1px solid #3a3346;padding:13px 24px calc(13px + env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(130px,1fr) minmax(180px,1.5fr) minmax(80px,1fr);align-items:center;gap:24px}
    .now-title{font-weight:700;font-size:13px}.now-sub{font-size:11px;color:var(--muted)}.controls{display:flex;align-items:center;justify-content:center;gap:17px}.control{border:0;background:none;color:var(--text);font-size:18px}.control.main{width:38px;height:38px;border-radius:50%;background:var(--text);color:#18151f}
    .progress-row{display:flex;gap:10px;align-items:center;font-size:10px;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}.player-right{display:flex;align-items:center;justify-content:end;gap:9px;color:var(--muted);font-size:12px}
    @media(max-width:700px){.wrap{padding:0 16px}header{height:68px}.nav{gap:12px}.nav .hide{display:none}.hero{grid-template-columns:1fr;padding:52px 0 30px;gap:24px}.hero-art{min-height:190px}.section-head{align-items:stretch;flex-direction:column}.search{width:100%}.track{grid-template-columns:38px minmax(0,1fr) 65px;gap:10px;padding:12px 4px}.track .bpm{display:none}.contact{padding:8px 7px;font-size:11px}.player{grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}.player-info{min-width:0}.player-center{grid-column:1/-1;grid-row:2;display:flex;align-items:center;gap:12px}.controls{gap:13px}.progress-row{flex:1}.player-right{display:none}footer{padding-bottom:125px}}
  </style>
</head>
